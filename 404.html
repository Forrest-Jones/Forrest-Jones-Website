<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Page not found — Forrest Jones</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%2300d3a7'%3EFJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&display=swap">
  <!-- Styles are inlined and links are absolute: GitHub Pages serves this file for any missing
       path, including nested ones, so relative URLs cannot be trusted here. -->
  <style>
    :root { --bg:#0b0f14; --surface:#131b25; --line:#24313f; --text:#e8eef5; --muted:#9aabbd; --dim:#6f8296; --accent:#00d3a7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
           font-family:'Inter','Segoe UI',system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
    main { max-width:560px; text-align:center; }
    .code { font-family:'Sora',system-ui,sans-serif; font-size:clamp(4rem,14vw,7rem); font-weight:700; letter-spacing:-0.04em; line-height:1; color:var(--accent); margin:0 0 12px; }
    h1 { font-family:'Sora',system-ui,sans-serif; font-size:clamp(1.4rem,4vw,2rem); margin:0 0 12px; letter-spacing:-0.02em; }
    p { color:var(--muted); margin:0 0 28px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    .btn { display:inline-flex; align-items:center; padding:13px 26px; border-radius:999px; font-family:'Sora',system-ui,sans-serif;
           font-weight:600; font-size:0.95rem; text-decoration:none; border:1px solid transparent; transition:transform .25s; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:var(--accent); color:#04211b; }
    .btn-ghost { color:var(--text); border-color:var(--line); }
    .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
    .mark { display:inline-grid; place-items:center; width:44px; height:44px; margin-bottom:28px; border-radius:12px;
            background:var(--surface); border:1px solid var(--line); font-family:Georgia,serif; font-weight:700; color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FJ</div>
    <p class="code" aria-hidden="true">404</p>
    <h1>That page is not here.</h1>
    <p>The link may be old, or the address may have a typo. Everything on this site lives on one page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://www.proverbs1821.com/">Back to the site</a>
      <a class="btn btn-ghost" href="https://www.proverbs1821.com/#contact">Contact Forrest</a>
    </div>
  </main>
</body>
</html>
